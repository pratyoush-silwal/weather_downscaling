runs_root: runs/hyperparameter_sweep
resume: true
overwrite_data: false
continue_on_error: false
selection_metric: best_val_loss

# Optional fixed settings applied to every run.
fixed_overrides:
  training.epochs: 50
  training.batch_size: 1
  training.device: cpu

# Optional subsets for quicker experiments.
months: null
train_months: null
val_months: null

# Keys that force a separate prepared graph/tensor set.
prep_key_prefixes:
  - region.
  - graph.

aliases:
  region.clip_buffer_deg: buffer
  model.hidden_channels: hidden
  model.num_layers: layers
  model.dropout: dropout
  training.learning_rate: lr
  training.weight_decay: wd

search_space:
  region.clip_buffer_deg:
    - 0.0
    - 0.05
    - 0.10
    - 0.20
    - 0.30
  model.hidden_channels:
    - 128
  model.num_layers:
    - 4
  model.dropout:
    - 0.1
  training.learning_rate:
    - 0.0001
  training.weight_decay:
    - 0.00001
